
name: Build Melo APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: melo-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Melo Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Android project
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find . -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "::error::No Android Gradle settings file found."
            find . -maxdepth 3 -type f | head -n 100
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

          if [ -f "$ROOT/gradlew" ] && \
             [ -f "$ROOT/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "wrapper=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Gradle wrapper missing. Add gradlew and gradle/wrapper files."
            exit 1
          fi

          echo "Android project root: $ROOT"

      - name: Detect Java version
        id: java
        working-directory: ${{ steps.detect.outputs.root }}
        shell: bash
        run: |
          if grep -rqE \
            'VERSION_21|jvmTarget\s*=\s*"21"|JavaVersion\.toVersion\(21\)' \
            --include='*.gradle' --include='*.gradle.kts' .; then
            echo "version=21" >> "$GITHUB_OUTPUT"
          else
            echo "version=17" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle wrapper
        working-directory: ${{ steps.detect.outputs.root }}
        run: chmod +x ./gradlew

      - name: Build Debug APK
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Melo-debug-APK
          path: ${{ steps.detect.outputs.root }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Build Release APK
        id: release
        continue-on-error: true
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload Release APK
        if: steps.release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Melo-release-APK
          path: ${{ steps.detect.outputs.root }}/**/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Melo-build-reports
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
