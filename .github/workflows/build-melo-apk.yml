
name: Build Melo APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      build_release:
        description: "Also build a release APK"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ZIP_NAME: Melo_Final_Stable_Source-1.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP if present
        shell: bash
        run: |
          if [ -f "$GITHUB_WORKSPACE/$ZIP_NAME" ]; then
            echo "Source ZIP found. Extracting..."
            mkdir -p "$GITHUB_WORKSPACE/melo-source"
            unzip -q "$GITHUB_WORKSPACE/$ZIP_NAME" \
              -d "$GITHUB_WORKSPACE/melo-source"
            echo "SOURCE_DIR=$GITHUB_WORKSPACE/melo-source" >> "$GITHUB_ENV"
          else
            echo "No source ZIP found. Using repository files."
            echo "SOURCE_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi

      - name: Detect Android project and Gradle version
        id: detect
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find "$SOURCE_DIR" \
            -mindepth 1 -maxdepth 7 -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%d\t%p\n' | sort -n | head -1 | cut -f2-)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Could not find settings.gradle or settings.gradle.kts."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS_FILE")
          echo "root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

          echo "Android project root: $PROJECT_ROOT"

          if [ -f "$PROJECT_ROOT/gradlew" ] && \
             [ -f "$PROJECT_ROOT/gradle/wrapper/gradle-wrapper.properties" ] && \
             [ -f "$PROJECT_ROOT/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "wrapper=true" >> "$GITHUB_OUTPUT"
            chmod +x "$PROJECT_ROOT/gradlew"
            echo "Complete Gradle wrapper found."
          else
            echo "wrapper=false" >> "$GITHUB_OUTPUT"
            echo "Gradle wrapper is missing or incomplete."
            echo "The workflow will use an installed Gradle version."
          fi

          export PROJECT_ROOT

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["PROJECT_ROOT"])

          patterns = [
              re.compile(r'com\.android\.tools\.build:gradle:([0-9]+\.[0-9]+(?:\.[0-9]+)?)'),
              re.compile(r'''id\s*['"]com\.android\.(?:application|library)['"]\s*version\s*['"]([0-9]+\.[0-9]+(?:\.[0-9]+)?)'''),
              re.compile(r'''^\s*agp\s*=\s*['"]([0-9]+\.[0-9]+(?:\.[0-9]+)?)['"]''', re.M),
          ]

          files = []
          for pattern in ("*.gradle", "*.gradle.kts", "*.toml"):
              files.extend(root.rglob(pattern))

          # Ignore generated and dependency directories.
          files = [
              p for p in files
              if not any(part in {".gradle", "build", "node_modules"} for part in p.parts)
          ]

          agp = None
          for file in files:
              try:
                  content = file.read_text(errors="ignore")
              except Exception:
                  continue

              for pattern in patterns:
                  match = pattern.search(content)
                  if match:
                      agp = match.group(1)
                      break

              if agp:
                  break

          if agp:
              major_minor = ".".join(agp.split(".")[:2])
          else:
              major_minor = "8.7"
              agp = "unknown"

          gradle_versions = {
              "9.0": "9.1.0",
              "8.13": "8.13",
              "8.12": "8.13",
              "8.11": "8.13",
              "8.10": "8.11.1",
              "8.9": "8.11.1",
              "8.8": "8.10.2",
              "8.7": "8.9",
              "8.6": "8.7",
              "8.5": "8.7",
              "8.4": "8.6",
              "8.3": "8.4",
              "8.2": "8.2.1",
              "8.1": "8.0.2",
              "8.0": "8.0.2",
              "7.4": "7.5",
              "7.3": "7.4",
              "7.2": "7.3.3",
              "7.1": "7.2",
              "7.0": "7.0.2",
          }

          gradle = gradle_versions.get(major_minor, "8.9")

          java = "17"
          if major_minor.startswith("7."):
              java = "11"
          elif major_minor.startswith("6."):
              java = "11"

          print(f"Detected Android Gradle Plugin: {agp}")
          print(f"Selected Gradle: {gradle}")
          print(f"Selected Java: {java}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"agp={agp}\n")
              output.write(f"gradle_version={gradle}\n")
              output.write(f"java_version={java}\n")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.detect.outputs.java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.detect.outputs.gradle_version }}

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          set -e

          if [ "${{ steps.detect.outputs.wrapper }}" = "true" ]; then
            echo "Building with the project's Gradle wrapper."
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            echo "Building with the installed Gradle version."
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Melo-Debug-APK
          path: |
            ${{ steps.detect.outputs.root }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build release APK
        if: ${{ inputs.build_release == true }}
        shell: bash
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          set -e

          if [ "${{ steps.detect.outputs.wrapper }}" = "true" ]; then
            ./gradlew --no-daemon --stacktrace assembleRelease
          else
            gradle --no-daemon --stacktrace assembleRelease
          fi

      - name: Upload release APK
        if: ${{ inputs.build_release == true }}
        uses: actions/upload-artifact@v4
        with:
          name: Melo-Release-APK
          path: |
            ${{ steps.detect.outputs.root }}/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
