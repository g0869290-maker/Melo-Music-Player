
name: Build Melo APK

"on":
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:
    inputs:
      build_release:
        description: "Also build a release APK"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ZIP_NAME: Melo_Final_Stable_Source-1.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP if present
        shell: bash
        run: |
          if [ -f "$GITHUB_WORKSPACE/$ZIP_NAME" ]; then
            echo "Source ZIP found. Extracting..."
            mkdir -p "$GITHUB_WORKSPACE/melo-source"
            unzip -q "$GITHUB_WORKSPACE/$ZIP_NAME" -d "$GITHUB_WORKSPACE/melo-source"
            echo "SOURCE_DIR=$GITHUB_WORKSPACE/melo-source" >> "$GITHUB_ENV"
          else
            echo "No source ZIP found. Using repository files."
            echo "SOURCE_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi

      - name: Detect Android project and Gradle version
        id: detect
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find "$SOURCE_DIR" \
            -mindepth 1 -maxdepth 7 -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%d\t%p\n' | sort -n | head -1 | cut -f2-)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Could not find settings.gradle or settings.gradle.kts."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS_FILE")
          echo "root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

          if [ -f "$PROJECT_ROOT/gradlew" ] && \
             [ -f "$PROJECT_ROOT/gradle/wrapper/gradle-wrapper.properties" ] && \
             [ -f "$PROJECT_ROOT/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "wrapper=true" >> "$GITHUB_OUTPUT"
            chmod +x "$PROJECT_ROOT/gradlew"
          else
            echo "wrapper=false" >> "$GITHUB_OUTPUT"
          fi

          export PROJECT_ROOT

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["PROJECT_ROOT"])
          candidates = [
              root / "build.gradle",
              root / "build.gradle.kts",
              *root.glob("**/build.gradle"),
              *root.glob("**/build.gradle.kts"),
          ]

          agp = None
          for path in candidates:
              if not path.is_file():
                  continue
              text = path.read_text(errors="ignore")
              match = re.search(
                  r"(?:com\.android\.(?:application|library)|com\.android\.tools\.build:gradle)[^\n]*?['\"](\d+\.\d+(?:\.\d+)?)",
                  text
              )
              if match:
                  agp = match.group(1)
                  break

          if agp:
              print(f"Detected Android Gradle Plugin: {agp}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write(f"agp={agp}\n")
          else:
              print("Android Gradle Plugin version not detected.")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "${{ steps.detect.outputs.root }}"

          if [ "${{ steps.detect.outputs.wrapper }}" = "true" ]; then
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            echo "::error::Gradle wrapper is missing. Include gradlew and gradle/wrapper files in the source ZIP."
            exit 1
          fi

      - name: Build release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        shell: bash
        run: |
          set -e
          cd "${{ steps.detect.outputs.root }}"
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APK files
        if: always()
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          find "$SOURCE_DIR" -type f -name "*.apk" \
            -exec cp -v {} "$GITHUB_WORKSPACE/apk-output/" \; || true

          if [ -z "$(find "$GITHUB_WORKSPACE/apk-output" -name "*.apk" -print -quit)" ]; then
            echo "No APK files were generated."
          fi

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Melo-APK
          path: apk-output/*.apk
          if-no-files-found: warn
          retention-days: 14
